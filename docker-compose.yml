services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.15.0
    ports:
      - 4318:4318
      - 16686:16686
    restart: on-failure

  postgres:
    image: postgres
    restart: always
    env_file:
      - .env
    ports:
      - 5433:5432
    volumes:
      - ./db/:/docker-entrypoint-initdb.d/

  api:
    build:
      context: api
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - OTLP_ENDPOINT_URL=http://jaeger:4318/v1/traces
      - Essence__PostgreConnection__ConnectionString=Server=postgres;Port=5432;Database=${POSTGRES_DB};User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - 5011:5010
    depends_on:
      - postgres
      - jaeger
      

  app:
    build:
      context: app
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - 90:80
    depends_on:
      - api

